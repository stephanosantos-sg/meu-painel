<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#3a0a0a"/>
      <stop offset="55%" stop-color="#1a0606"/>
      <stop offset="100%" stop-color="#08080c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4D17A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B1F"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <circle cx="90" cy="90" r="78" fill="none" stroke="url(#rim)" stroke-width="2" opacity="0.55"/>
  <!-- Aquila Romana — stylized legionary eagle -->
  <g fill="url(#gold)" stroke="#7a5c10" stroke-width="0.6">
    <!-- left wing -->
    <path d="M90 70 C 70 64, 50 70, 32 90 C 50 86, 62 90, 72 100 C 60 102, 50 110, 44 122 C 60 116, 76 116, 86 124 L 90 116 Z"/>
    <!-- right wing (mirror) -->
    <path d="M90 70 C 110 64, 130 70, 148 90 C 130 86, 118 90, 108 100 C 120 102, 130 110, 136 122 C 120 116, 104 116, 94 124 L 90 116 Z"/>
    <!-- body -->
    <path d="M84 70 L 96 70 L 100 92 L 96 122 L 90 132 L 84 122 L 80 92 Z"/>
    <!-- head facing right -->
    <path d="M88 64 C 88 58, 92 54, 98 54 L 106 60 L 100 64 L 100 70 L 92 70 Z"/>
    <!-- beak -->
    <path d="M104 60 L 110 60 L 104 64 Z" fill="#7a5c10"/>
    <!-- tail -->
    <path d="M84 122 L 78 138 L 90 132 L 102 138 L 96 122 Z"/>
    <!-- legs/talons gripping perch -->
    <rect x="84" y="132" width="2.5" height="8"/>
    <rect x="93.5" y="132" width="2.5" height="8"/>
  </g>
  <!-- perch / SPQR plinth -->
  <rect x="62" y="140" width="56" height="8" rx="1.5" fill="url(#gold)" stroke="#7a5c10" stroke-width="0.5"/>
  <text x="90" y="146.5" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="6.5" fill="#1a0606" letter-spacing="2">SPQR</text>
  <!-- eye -->
  <circle cx="99" cy="60" r="1.1" fill="#1a0606"/>
</svg>
